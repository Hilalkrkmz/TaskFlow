spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/taskflow
    username: taskflow_user
    password: taskflow_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  mail:
      host: smtp.gmail.com
      port: 587
      username: taskflow.app.team@gmail.com
      password: ${MAIL_PASSWORD}
      properties:
        mail:
          smtp:
            auth: true
            starttls:
              enable: true

server:
  port: 8080

jwt:
  secret: this-is-a-very-long-development-only-secret-key-change-in-production-123456
  expiration-ms: 86400000

app:
  mail:
    from: taskflow.app.team@gmail.com
  verification:
    code-expiry-minutes: 10