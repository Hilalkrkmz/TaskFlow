spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/taskflow}
    username: ${DB_USERNAME:taskflow_user}
    password: ${DB_PASSWORD:taskflow_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:this-is-a-very-long-development-only-secret-key-change-in-production-123456}
  expiration-ms: 86400000

app:
  mail:
    # Resend'in ucretsiz/domain dogrulanmamis hesabinda gonderici adresi bu
    # sabit test adresi olmak zorunda - kendi domainini dogrularsan degistirilebilir.
    from: ${MAIL_FROM:onboarding@resend.dev}
    resend-api-key: ${RESEND_API_KEY:}
  verification:
    code-expiry-minutes: 10