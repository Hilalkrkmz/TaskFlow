spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/taskflow}
    username: ${DB_USERNAME:taskflow_user}
    password: ${DB_PASSWORD:taskflow_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  mail:
      host: smtp.gmail.com
      port: ${MAIL_PORT:587}
      username: taskflow.app.team@gmail.com
      password: ${MAIL_PASSWORD}
      properties:
        mail:
          smtp:
            auth: true
            starttls:
              enable: ${MAIL_STARTTLS:true}
            ssl:
              enable: ${MAIL_SSL:false}

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:this-is-a-very-long-development-only-secret-key-change-in-production-123456}
  expiration-ms: 86400000

app:
  mail:
    from: taskflow.app.team@gmail.com
  verification:
    code-expiry-minutes: 10