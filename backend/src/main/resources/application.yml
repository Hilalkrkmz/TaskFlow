spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/taskflow}
    username: ${DB_USERNAME:taskflow_user}
    password: ${DB_PASSWORD:taskflow_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:this-is-a-very-long-development-only-secret-key-change-in-production-123456}
  expiration-ms: 86400000

app:
  mail:
    # Brevo'da dogrulanan gonderen adresi - Resend'in aksine, tek bir email'i
    # dogrulamak yeterli, domain sahibi olmaya gerek yok.
    from: ${MAIL_FROM:taskflow.app.team@gmail.com}
    brevo-api-key: ${BREVO_API_KEY:}
  verification:
    code-expiry-minutes: 10